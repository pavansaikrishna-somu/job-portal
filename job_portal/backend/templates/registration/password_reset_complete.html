{% extends 'base.html' %}
{% block title %}Password Reset Complete | CareerConnect{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card hover-lift p-4 text-center">
                <h1 class="h3 mb-2">Password Reset Complete</h1>
                <p class="text-muted mb-4">Your password has been set. You may now sign in with your new password.</p>
                <a href="{% url 'users:login' %}" class="btn btn-premium w-100">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
